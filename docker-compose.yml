services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: supportdesk_api
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: asafr-dev/supportdesk-api
    build:
      context: .
      target: runtime
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/supportdesk_api}
      ENV: ${ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTO_CREATE_DB: ${AUTO_CREATE_DB:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - .:/app
    command: ["sh", "-c", "python -m uvicorn app.main:app --reload --host 0.0.0.0 --port ${PORT:-8080} --ws websockets-sansio"]
    depends_on:
      - db

  api-test:
    build:
      context: .
      target: test
    profiles: ["test"]

volumes:
  pgdata: {}

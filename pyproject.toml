[project]
name = "supportdesk-api"
version = "1.0.0"
description = "FastAPI service for SupportDesk (sample reference implementation)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-json-logger>=3.1,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pre-commit>=3.8,<5.0",
  "alembic>=1.13,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","I","B","UP","SIM"]
ignore = ["E501","B008"]

[tool.mypy]
packages = ["app"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
